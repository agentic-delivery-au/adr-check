name: release-please

# Maintains an open release PR off main: it accumulates the Conventional Commits
# since the last release, and merging it tags the version and cuts the GitHub
# release. The publish job then uploads the tagged build to PyPI.

on:
  push:
    branches: [main]

# The App token below does all the work, so GITHUB_TOKEN is left with nothing.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Holds the release App key and deploys only from main: README "Repository settings" has the limits.
    environment: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A release PR opened with GITHUB_TOKEN triggers no workflows, so the
      # checks the ruleset requires would never report on it and it could never
      # merge. No owner or repositories input, so the token covers this
      # repository only; the permission-* set is release-please's documented
      # minimum, and without it the token inherits every permission the
      # installation holds. README "Repository settings" covers the App setup.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # PyPI trusted publishing is registered against this file name and the `pypi` environment.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  # Only the release App may move v0 and v0.1 (tag ruleset), hence its token and environment.
  floating-tags:
    # After publish, so @v0 never points at a release PyPI does not have.
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      # A missing tag answers 404 and is created. A tag already at a later release
      # stays put, so re-running an older release's job cannot move callers back.
      - name: Move v<major> and v<major>.<minor>
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          MINOR: ${{ needs.release-please.outputs.minor }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          for tag in "v${MAJOR}" "v${MAJOR}.${MINOR}"; do
            if current=$(gh api "repos/${REPO}/git/ref/tags/${tag}" --jq .object.sha 2>err); then
              status=$(gh api "repos/${REPO}/compare/${current}...${SHA}" --jq .status)
              if [ "${status}" = behind ]; then
                echo "${tag} stays at ${current}: ${SHA} is an older release"
                continue
              fi
              gh api --method PATCH "repos/${REPO}/git/refs/tags/${tag}" \
                -f sha="${SHA}" -F force=true >/dev/null
            elif grep -q 'HTTP 404' err; then
              gh api --method POST "repos/${REPO}/git/refs" \
                -f ref="refs/tags/${tag}" -f sha="${SHA}" >/dev/null
            else
              cat err >&2
              exit 1
            fi
            echo "${tag} -> ${SHA}"
          done
