name: release-please

# Maintains an open release PR off main: it accumulates the Conventional Commits
# since the last release, and merging it tags the version and cuts the GitHub
# release. The publish job then uploads the tagged build to PyPI.

on:
  push:
    branches: [main]

# The App token below does all the work, so GITHUB_TOKEN is left with nothing.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Holds the release App key and deploys only from main: README "Repository settings" has the limits.
    environment: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A release PR opened with GITHUB_TOKEN triggers no workflows, so the
      # checks the ruleset requires would never report on it and it could never
      # merge. No owner or repositories input, so the token covers this
      # repository only; the permission-* set is release-please's documented
      # minimum, and without it the token inherits every permission the
      # installation holds. README "Repository settings" covers the App setup.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # PyPI trusted publishing is registered against this file name and the `pypi` environment.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@v1.14.2
