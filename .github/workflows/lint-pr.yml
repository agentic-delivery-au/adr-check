name: 'Lint PR'

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize

# Keyed on the workflow too: concurrency groups are repo-wide, so without it this
# would cancel the pre-commit run for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      # Dependabot titles its own PRs and we don't control the casing it picks
      # (e.g. "Bump actions/cache from 4 to 6"), so it fails the lowercase check
      # below by design rather than by mistake.
      #
      # This condition has to stay on the step, not the job. `Validate PR title`
      # is a required status check, and a skipped job never reports a conclusion,
      # so hoisting it to the job would leave every Dependabot PR permanently
      # blocked. A job whose only step is skipped still succeeds.
      - uses: amannn/action-semantic-pull-request@v6
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # PR title must not start with a capital letter
          subjectPattern: ^(?![A-Z]).+$
          # If the PR only contains a single commit, the action will validate that
          # it matches the configured pattern.
          validateSingleCommit: true
          # Related to `validateSingleCommit` you can opt-in to validate that the PR
          # title matches a single commit to avoid confusion.
          validateSingleCommitMatchesPrTitle: true
