version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # The dev dependency group pins exact versions, per the Python coding
  # standard, so this is the only thing that moves them.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
