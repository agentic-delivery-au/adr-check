- id: adr-check
  name: adr-check
  description: Check the ADRs in docs/adr against the ADR rules, without comparing with main
  entry: adr-check
  language: python
  language_version: python3.14  # the package needs it, and pre-commit's own Python may be older
  files: ^docs/adr/
  pass_filenames: false  # the check reads the whole directory, including the other ADRs
